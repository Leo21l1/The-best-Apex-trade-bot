# PROJECT APEX local stack. Usage: cp .env.example .env && docker compose up --build
name: project-apex

x-api-env: &api-env
  APEX_ENVIRONMENT: ${APEX_ENVIRONMENT:-development}
  APEX_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-apex}:${POSTGRES_PASSWORD:-apex_dev_password}@postgres:5432/${POSTGRES_DB:-apex}
  APEX_REDIS_URL: redis://redis:6379/0
  APEX_SECRET_KEY: ${APEX_SECRET_KEY:?set APEX_SECRET_KEY in .env}
  APEX_BOOTSTRAP_TOKEN: ${APEX_BOOTSTRAP_TOKEN:-}
  APEX_COOKIE_SECURE: ${APEX_COOKIE_SECURE:-false}
  APEX_CORS_ORIGINS: '["http://localhost:3000"]'
  APEX_ANTHROPIC_API_KEY: ${APEX_ANTHROPIC_API_KEY:-}
  APEX_MARKET_DATA_PROVIDER: ${APEX_MARKET_DATA_PROVIDER:-none}
  APEX_MARKET_DATA_BACKFILL_HOURS: ${APEX_MARKET_DATA_BACKFILL_HOURS:-72}
  APEX_DATABENTO_API_KEY: ${APEX_DATABENTO_API_KEY:-}
  APEX_DATABENTO_ROLL_RULE: ${APEX_DATABENTO_ROLL_RULE:-v}
  APEX_DATABENTO_TIMEOUT_SECONDS: ${APEX_DATABENTO_TIMEOUT_SECONDS:-60}
  APEX_DATABENTO_MAX_RETRIES: ${APEX_DATABENTO_MAX_RETRIES:-3}
  APEX_COPILOT_MODEL: ${APEX_COPILOT_MODEL:-claude-opus-5-5}
  APEX_CALENDAR_ICS_URLS: ${APEX_CALENDAR_ICS_URLS:-[]}
  APEX_CALENDAR_FOREXFACTORY: ${APEX_CALENDAR_FOREXFACTORY:-true}
  APEX_CALENDAR_PRE_EVENT_MINUTES: ${APEX_CALENDAR_PRE_EVENT_MINUTES:-15}
  APEX_CALENDAR_POST_EVENT_MINUTES: ${APEX_CALENDAR_POST_EVENT_MINUTES:-15}
  APEX_NEWS_UPCOMING_MINUTES: ${APEX_NEWS_UPCOMING_MINUTES:-60}
  APEX_NEWS_ACTIVE_AFTER_MINUTES: ${APEX_NEWS_ACTIVE_AFTER_MINUTES:-5}
  APEX_NEWS_STALE_HOURS: ${APEX_NEWS_STALE_HOURS:-3}
  APEX_MIN_NET_REWARD_RISK: ${APEX_MIN_NET_REWARD_RISK:-1.5}
  APEX_REQUIRE_VALIDATED_STRATEGY: ${APEX_REQUIRE_VALIDATED_STRATEGY:-true}
  APEX_AUTOMATION_MODE: ${APEX_AUTOMATION_MODE:-APEX_MANUAL}
  APEX_AUTOPILOT_STRATEGIES: ${APEX_AUTOPILOT_STRATEGIES:-["ES:mtf_trend:t1_all","NQ:breakout_retest:t2_all"]}
  APEX_AUTOPILOT_CONTRACTS: ${APEX_AUTOPILOT_CONTRACTS:-1}
  APEX_AUTOPILOT_MAX_RISK_PER_TRADE: ${APEX_AUTOPILOT_MAX_RISK_PER_TRADE:-500}
  APEX_BROKER_ADAPTER: ${APEX_BROKER_ADAPTER:-}
  APEX_BROKER_ACCOUNT_TYPE: ${APEX_BROKER_ACCOUNT_TYPE:-}
  APEX_BROKER_LIVE_ENABLED: ${APEX_BROKER_LIVE_ENABLED:-false}
  APEX_NOTIFY_PROVIDER: ${APEX_NOTIFY_PROVIDER:-none}
  APEX_NOTIFY_MIN_SEVERITY: ${APEX_NOTIFY_MIN_SEVERITY:-info}
  APEX_NOTIFY_NTFY_URL: ${APEX_NOTIFY_NTFY_URL:-}
  APEX_NOTIFY_NTFY_TOKEN: ${APEX_NOTIFY_NTFY_TOKEN:-}
  APEX_NOTIFY_PUSHOVER_TOKEN: ${APEX_NOTIFY_PUSHOVER_TOKEN:-}
  APEX_NOTIFY_PUSHOVER_USER: ${APEX_NOTIFY_PUSHOVER_USER:-}
  APEX_NOTIFY_TELEGRAM_BOT_TOKEN: ${APEX_NOTIFY_TELEGRAM_BOT_TOKEN:-}
  APEX_NOTIFY_TELEGRAM_CHAT_ID: ${APEX_NOTIFY_TELEGRAM_CHAT_ID:-}
  # The web container proxies /api/* from inside the compose network.
  APEX_TRUSTED_PROXIES: '["127.0.0.1", "::1", "172.16.0.0/12"]'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apex_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-apex}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10
    # Host port is configurable so a locally installed PostgreSQL on 5432 does not conflict.
    ports: ["127.0.0.1:${APEX_PG_HOST_PORT:-5432}:5432"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    restart: unless-stopped
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["127.0.0.1:8000:8000"]

  worker:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    restart: unless-stopped
    command: ["python", "-m", "app.workers.main"]
    environment: *api-env
    healthcheck: { disable: true }
    depends_on:
      api: { condition: service_healthy }

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        APEX_API_ORIGIN: http://api:8000
        NEXT_PUBLIC_APEX_WS_URL: ws://localhost:8000/api/ws
    depends_on:
      api: { condition: service_healthy }
    ports: ["127.0.0.1:3000:3000"]

volumes:
  pgdata:
  redisdata:
